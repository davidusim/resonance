[project]
name = "resonance-alert"
version = "0.5.0"
description = "Consent-based, synchronized emergency audio for enrolled receivers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.141.1",
  "python-multipart==0.0.32",
  "starlette==1.3.1",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.7.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.16.4",
  "setuptools==83.0.0",
]

[project.scripts]
resonance = "resonance.main:run"

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["resonance"]

[tool.setuptools.data-files]
static = ["static/*"]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
