[project]
name = "resonance-alert"
version = "0.1.0"
description = "Consent-based, synchronized emergency audio for enrolled receivers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.135.3",
  "python-multipart==0.0.32",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.15.22",
]

[project.scripts]
resonance = "resonance.main:run"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["resonance"]

[tool.setuptools.data-files]
static = ["static/*"]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
