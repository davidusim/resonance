name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: node --check static/admin.js
      - run: node --check static/receiver.js
      - run: pytest -q -W error
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - if: matrix.python-version == '3.12'
        run: pip-audit --progress-spinner off

  container:
    name: Container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag resonance-alert:ci .
      - name: Verify non-root runtime and health
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' resonance-alert:ci)" = "resonance"

          container_id="$(docker run --detach \
            --publish 127.0.0.1:18080:8080 \
            --env RESONANCE_ADMIN_TOKEN=ci-admin-token-that-is-long-enough \
            resonance-alert:ci)"
          cleanup() {
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in {1..30}; do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [[ "$health" == "healthy" ]]; then
              test "$(curl --fail --silent http://127.0.0.1:18080/healthz)" \
                = '{"status":"ok","database":"ok"}'
              curl --fail --silent --output /dev/null http://127.0.0.1:18080/
              curl --fail --silent --output /dev/null http://127.0.0.1:18080/admin
              exit 0
            fi
            if [[ "$health" == "unhealthy" ]]; then
              break
            fi
            sleep 1
          done

          docker logs "$container_id"
          docker inspect "$container_id"
          exit 1
